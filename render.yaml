# Render blueprint. Secrets (API keys) are deliberately marked sync:false so they are entered
# in the Render dashboard rather than committed to the repository.
services:
  - type: web
    name: specguard-api
    runtime: python
    plan: free
    region: singapore
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: USE_LLM
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FALLBACK_MODEL
        value: openai/gpt-oss-20b
      # gpt-oss reasons before answering and charges those tokens to the same
      # completion budget as the JSON, so keep the chain of thought short.
      - key: GROQ_REASONING_EFFORT
        value: low
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # Ollama is a local-only tier; the hosted deployment relies on Gemini then Groq.
      - key: LLM_PROVIDER_ORDER
        value: '["gemini","groq"]'
      # 384-dimensional model: ~390MB resident, which fits the free plan's 512MB where the
      # 768-dim default (~740MB) does not. Requires migration 0005 to match the vector column.
      - key: EMBEDDINGS_ENABLED
        value: "true"
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      # Set to the deployed frontend origin once it exists.
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: specguard-web
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Must point at the deployed API, including the /api/v1 prefix.
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
